name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distributions
      run: twine check --strict dist/*
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Uses PyPI Trusted Publishing (OIDC); no API token secret is required.
    # Configure the publisher for this repository and workflow at
    # https://pypi.org/manage/project/pytactl/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/pytactl
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
